version: 2

models:
  - name: stg_zillow_city_data
    description: "Staging model for Zillow city-level home price data, unpivoted from wide format to long format"
    columns:
      - name: city_state
        description: "Combined city and state (e.g., 'New York, NY')"
        
      - name: price_date
        description: "Date of the home price observation"
        
      - name: home_price
        description: "Median home price value for the region on the given date"

  - name: stg_city_pop_density_change
    description: "Staging model for city population density change data"
    columns:
      - name: city_state
        description: "Combined city and state (e.g., 'New York, NY')"
        
      - name: pop_density_change_pct
        description: "Percentage change in population density"

