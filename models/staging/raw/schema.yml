version: 2

models:
  - name: stg_zillow_city_data_filtered
    description: "Pre-filtered Zillow data selecting only 2010 and 2025 date columns, cities with SIZERANK <= 150, and excluding Rochester"
    columns:
      - name: REGIONNAME
        description: "City name"
        
      - name: STATE
        description: "State abbreviation"
        
      - name: SIZERANK
        description: "Population size ranking"

  - name: stg_zillow_city_data
    description: "Staging model for Zillow city-level home price data, unpivoted from wide format to long format"
    columns:
      - name: city
        description: "City name"
        
      - name: state
        description: "State abbreviation"
        
      - name: price_date
        description: "Date of the home price observation"
        
      - name: home_price
        description: "Median home price value for the region on the given date"

  - name: stg_city_pop_density_change
    description: "Staging model for city population density change data"
    columns:
      - name: city
        description: "City name"
        
      - name: state
        description: "State abbreviation"
        
      - name: pop_density_change_pct
        description: "Percentage change in population density (cleaned from string format to numeric)"

