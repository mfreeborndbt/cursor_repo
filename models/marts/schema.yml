version: 2

models:
  - name: fct_city_price_density_analysis
    description: >
      Fact table combining Zillow home price data with population density changes.
      Contains average home prices for 2010 and 2025 alongside population density change percentages.
      Joined on city name for the top 150 cities by size rank.
    tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 99
    columns:
      - name: city
        description: "City name"
      
      - name: state
        description: "State abbreviation"
      
      - name: avg_home_price_2010
        description: "Average home price for the year 2010"
      
      - name: avg_home_price_2025
        description: "Average home price for the year 2025 (based on 10 months of data)"
      
      - name: pop_density_change_pct
        description: "Percentage change in population density"

